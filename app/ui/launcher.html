<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aibo</title>
<style>
  /*
   * The quick-message bar: one line to her from anywhere, summoned by the
   * global shortcut. The window is transparent and frosted by an AppKit
   * NSVisualEffectView (see lib.rs), so the page paints only a translucent
   * wash on top of that glass and fills the window edge to edge — any margin
   * here would show as a black rectangle around the bar.
   */
  :root {
    --surface: #131111; --ink: #ece9e6;
    --muted-fg: color-mix(in oklab, var(--ink) 52%, transparent);
    --sea: #16233d;
    color-scheme: dark;
  }
  @font-face {
    font-family: 'Google Sans Flex';
    src: url('boot/GoogleSansFlex.woff2') format('woff2');
    font-weight: 300 800; font-style: normal; font-display: swap;
  }
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    font-family: 'Google Sans Flex', ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans', sans-serif;
    color: var(--ink); user-select: none; -webkit-user-select: none;
    /* Over frosted glass, unshadowed text smears into whatever is behind it. */
    text-shadow: 0 1px 2px rgb(0 0 0 / .35);
  }
  .bar {
    position: relative; display: flex; align-items: center; gap: 12px;
    width: 100%; height: 100%; padding: 0 12px; box-sizing: border-box;
    border-radius: 16px;   /* matches the vibrancy view's corner radius */
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .08);
    /* Her sea, thin enough that the blur behind still reads as glass. */
    background: linear-gradient(180deg,
      color-mix(in oklab, var(--sea) 58%, transparent),
      color-mix(in oklab, var(--surface) 50%, transparent));
    overflow: hidden;
  }
  /* A soft glow off her side of the bar, the way the stage lights her. */
  .bar::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120px 64px at 34px 50%, rgb(120 168 255 / .16), transparent 70%);
  }
  .avatar {
    position: relative; width: 40px; height: 40px; flex: none; border-radius: 50%;
    object-fit: cover; object-position: center;
    box-shadow: 0 0 0 1px rgb(255 255 255 / .18), 0 2px 8px rgb(0 0 0 / .35);
    background: var(--sea);
  }
  input {
    position: relative; flex: 1; min-width: 0; height: 100%;
    border: 0; background: none; outline: none;
    color: var(--ink); font: inherit; font-size: 15px; letter-spacing: .01em;
    text-shadow: inherit; user-select: text; -webkit-user-select: text;
  }
  input::placeholder { color: var(--muted-fg); }
  .hint {
    position: relative; flex: none; min-width: 26px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center; padding: 0 8px;
    border-radius: 7px; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .1);
    background: rgb(255 255 255 / .07);
    color: var(--muted-fg); font-size: 11.5px; line-height: 1;
    transition: opacity .15s, color .15s;
  }
  /* While the line is in flight the bar dims rather than swapping layout. */
  .bar.sending input, .bar.sending .avatar, .bar.sending .hint { opacity: .55; }
  .bar.failed .hint { color: #ffb4a8; }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <img class="avatar" id="avatar" src="boot/avatar.jpg" alt="">
    <input id="text" type="text" placeholder="Message 小黑鱼" autocomplete="off" spellcheck="false">
    <span class="hint" id="hint">⏎</span>
  </div>
  <script>
    const { core, event } = window.__TAURI__;
    const bar = document.getElementById('bar');
    const input = document.getElementById('text');
    const hint = document.getElementById('hint');

    const reset = () => { hint.textContent = '⏎'; bar.classList.remove('sending', 'failed'); };
    const focusInput = () => { input.focus(); input.select(); };
    focusInput();
    // Re-focus every time the shortcut summons it: the window is reused, so
    // without this the caret stays wherever the last dismissal left it.
    event.listen('aibo://launcher-open', () => { reset(); focusInput(); });
    window.addEventListener('focus', focusInput);

    const dismiss = () => { input.value = ''; reset(); void core.invoke('hide_launcher'); };

    input.addEventListener('input', () => { if (bar.classList.contains('failed')) reset(); });
    input.addEventListener('keydown', async (e) => {
      if (e.key === 'Escape') { e.preventDefault(); dismiss(); return; }
      if (e.key !== 'Enter' || e.isComposing) return;   // never send mid-IME
      e.preventDefault();
      const text = input.value.trim();
      if (text === '' || bar.classList.contains('sending')) return;
      bar.classList.add('sending'); bar.classList.remove('failed'); hint.textContent = 'Sending…';
      try {
        await core.invoke('send_message', { text });
        input.value = '';
        reset();
      } catch {
        bar.classList.remove('sending'); bar.classList.add('failed');
        hint.textContent = 'Could not reach her';
      }
    });
  </script>
</body>
</html>
