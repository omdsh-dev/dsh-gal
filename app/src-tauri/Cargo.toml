[package]
name = "dsh-gal-app"
version = "0.1.0"
description = "dsh-gal: a visual-novel desktop shell for the DeepSeek Harness"
authors = ["William Jin"]
edition = "2021"
license = "BSD-3-Clause"

[lib]
name = "dsh_gal_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ureq = { version = "3", default-features = false }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
