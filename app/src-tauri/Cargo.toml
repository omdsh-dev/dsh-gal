[package]
name = "aibo-app"
version = "0.2.0"
description = "Aibo: a visual-novel desktop shell for the DeepSeek Harness"
authors = ["William Jin"]
edition = "2021"
license = "BSD-3-Clause"

[lib]
name = "aibo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ureq = { version = "3", default-features = false }
libc = "0.2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2.7.1"

# The launcher is a frameless transparent panel; this frosts it with a real
# NSVisualEffectView so it reads as glass over whatever is behind it.
[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.5"
# Who was frontmost before the launcher took over, so dismissing it hands focus
# straight back there instead of leaving Aibo the active app.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "libc"] }
# The launcher is re-classed into a non-activating NSPanel (see lib.rs): a plain
# NSWindow cannot take the keyboard without its app becoming active, which would
# drag the main window on screen behind the bar.
objc2 = "0.6"
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
